services:
  - type: web
    name: fake-news-detector
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -c \"import nltk; nltk.download('stopwords'); nltk.download('wordnet')\""
    startCommand: "gunicorn -c gunicorn.conf.py app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: MODEL_PATH
        value: models/model.joblib
      - key: VECTORIZER_PATH
        value: models/tfidf_vectorizer.joblib

